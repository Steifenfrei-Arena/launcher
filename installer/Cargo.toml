[package]
name = "steifenfrei-setup"
version = "1.0.0"
description = "Installer für den Steifenfrei-Arena-Launcher: installiert immer die neueste Version"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Ohne Tauri-CLI gebaut: custom-protocol liefert die Oberfläche aus der Programmdatei statt von einem Dev-Server
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "custom-protocol"] }
serde_json = "1"
# Wie der Launcher: TLS nur mit unserem eigenen CA-Zertifikat, Signatur und Prüfsumme wie beim Selbst-Update
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
ring = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell",
  "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
