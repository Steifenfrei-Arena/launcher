[package]
name = "steifenfrei-launcher"
version = "0.2.10"
description = "Launcher und Overlay für Steifenfrei Arena (The Isle Evrima)"
edition = "2021"
rust-version = "1.90"

[features]
# Nur der Admin-Launcher (../admin) baut src/net.rs und src/game.rs mit "admin": Taste F10, Updates über die Webseite
admin = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Ohne Tauri-CLI gebaut: custom-protocol liefert die Oberfläche aus der Programmdatei statt von einem Dev-Server
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "custom-protocol"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "sync", "rt"] }
# TLS nur mit unserem eigenen CA-Zertifikat (keine System- oder Web-Zertifikate)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
tokio-tungstenite = { version = "0.26", features = ["__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
getrandom = "0.2"
# Selbst-Update: Signatur (Ed25519) und Prüfsumme prüfen, siehe ../shared/update.rs
ring = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
